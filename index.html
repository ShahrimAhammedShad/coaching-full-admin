<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel | আইডিয়াল কোচিং সেন্টার</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #2563eb; --secondary: #10b981; --accent: #f59e0b; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --border: #e2e8f0; --radius: 12px; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .card { background: var(--surface); padding: 2rem; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 2rem; border: 1px solid var(--border); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; transition: 0.3s; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: white; padding: 8px 16px; font-size: 0.875rem; }
    .btn-edit { background: var(--accent); color: white; padding: 8px 16px; font-size: 0.875rem; margin-right: 8px; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    
    .notice-list { display: flex; flex-direction: column; gap: 1rem; }
    .notice-item { background: var(--bg); padding: 1.5rem; border-radius: 8px; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .notice-info h4 { margin-bottom: 4px; word-break: break-word; }
    .notice-info p { font-size: 0.875rem; color: #64748b; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-top: 8px; }
    .badge-valid { background: #d1fae5; color: #065f46; }
    .badge-expired { background: #fee2e2; color: #991b1b; }

    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(5px); }
    .auth-box { background: white; padding: 2.5rem; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- Security Gate -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2 style="margin-bottom: 0.5rem;"><i class="fas fa-shield-alt" style="color: var(--primary);"></i> Admin Login</h2>
      <p style="color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem;">নোটিশ ম্যানেজ করার জন্য লগইন করুন</p>
      <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন" style="margin-bottom: 1rem;">
      <button class="btn btn-primary" onclick="checkAuth()" style="width: 100%; justify-content: center;">প্রবেশ করুন</button>
      <p style="margin-top: 1rem; font-size: 0.8rem; color: #94a3b8;">(ডিফল্ট পাসওয়ার্ড: admin123)</p>
    </div>
  </div>

  <!-- Main Admin Content -->
  <div class="container" id="adminContent" style="display: none;">
    <div class="header">
      <h2><i class="fas fa-cog" style="color: var(--primary);"></i> নোটিশ ম্যানেজমেন্ট</h2>
      <a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> ওয়েবসাইটে ফিরে যান</a>
    </div>

    <!-- Add/Edit Form -->
    <div class="card">
      <h3 style="margin-bottom: 1.5rem;" id="formTitle">নতুন নোটিশ যোগ করুন</h3>
      <input type="hidden" id="noticeId">
      <div class="form-group">
        <label>নোটিশের বিবরণ *</label>
        <textarea id="noticeText" rows="3" placeholder="নোটিশের মূল বার্তা লিখুন..."></textarea>
      </div>
      <div class="form-group">
        <label>লিংক (ঐচ্ছিক)</label>
        <input type="url" id="noticeLink" placeholder="https://example.com/details">
      </div>
      <div class="form-group">
        <label>মেয়াদ শেষের তারিখ (Validity) *</label>
        <input type="date" id="noticeExpiry">
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" onclick="saveNotice()" id="saveBtn">
          <i class="fas fa-save"></i> সেভ করুন
        </button>
        <button class="btn btn-secondary" onclick="resetForm()" style="display: none;" id="cancelBtn">
          বাতিল
        </button>
      </div>
    </div>

    <!-- Notice List -->
    <div class="card">
      <h3 style="margin-bottom: 1.5rem;">সকল নোটিশ তালিকা</h3>
      <div id="noticeListContainer" class="notice-list">
        <p style="text-align: center; color: #64748b; padding: 2rem;"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK & Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9w9JuUpWSowQu6wlJeByDzlQOyYVEeR4",
      authDomain: "notice-8e40d.firebaseapp.com",
      projectId: "notice-8e40d",
      storageBucket: "notice-8e40d.firebasestorage.app",
      messagingSenderId: "755712330349",
      appId: "1:755712330349:web:ef69b934a9a446bb2a8d64"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Authentication Check
    window.checkAuth = () => {
      const pass = document.getElementById('adminPass').value;
      if(pass === 'admin123') { // আপনি চাইলে এই পাসওয়ার্ডটি পরিবর্তন করে নিতে পারেন
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadNotices();
      } else {
        alert('ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
      }
    };

    // Save or Update Notice
    window.saveNotice = async () => {
      const id = document.getElementById('noticeId').value;
      const text = document.getElementById('noticeText').value.trim();
      const link = document.getElementById('noticeLink').value.trim();
      const expiry = document.getElementById('noticeExpiry').value;

      if(!text || !expiry) { alert('বিবরণ এবং মেয়াদ অবশ্যই পূরণ করতে হবে!'); return; }

      const btn = document.getElementById('saveBtn');
      const originalBtnText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রসেসিং...';
      btn.disabled = true;

      try {
        const data = { text, link: link || '', expiry, updatedAt: new Date().toISOString() };
        if(id) {
          await updateDoc(doc(db, "notices", id), data);
        } else {
          data.createdAt = new Date().toISOString();
          await addDoc(collection(db, "notices"), data);
        }
        resetForm();
        loadNotices();
        alert('সফলভাবে সেভ হয়েছে! ✅');
      } catch(e) {
        console.error(e);
        alert('এরর হয়েছে: ' + e.message);
      }
      btn.innerHTML = originalBtnText;
      btn.disabled = false;
    };

    // Load Notices
    window.loadNotices = async () => {
      const container = document.getElementById('noticeListContainer');
      container.innerHTML = '<p style="text-align: center; color: #64748b;"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</p>';
      
      try {
        const q = query(collection(db, "notices"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        container.innerHTML = '';
        
        const today = new Date().setHours(0,0,0,0);

        if (snapshot.empty) {
          container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 2rem;">কোনো নোটিশ পাওয়া যায়নি।</p>';
          return;
        }

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const expiryDate = new Date(data.expiry).setHours(0,0,0,0);
          const isExpired = expiryDate < today;
          
          const div = document.createElement('div');
          div.className = 'notice-item';
          div.style.borderLeftColor = isExpired ? '#ef4444' : '#10b981';
          div.innerHTML = `
            <div class="notice-info" style="flex: 1;">
              <h4>${data.text}</h4>
              <p>
                ${data.link ? `<a href="${data.link}" target="_blank" style="color: var(--primary); text-decoration: underline;">লিংক দেখুন</a> • ` : ''} 
                মেয়াদ: ${data.expiry}
              </p>
              <span class="badge ${isExpired ? 'badge-expired' : 'badge-valid'}">
                ${isExpired ? 'মেয়াদ উত্তীর্ণ' : 'সক্রিয়'}
              </span>
            </div>
            <div style="display: flex; align-items: center;">
              <button class="btn btn-edit" onclick="editNotice('${docSnap.id}', \`${data.text.replace(/`/g, "\\`")}\`, '${data.link}', '${data.expiry}')">
                <i class="fas fa-edit"></i> এডিট
              </button>
              <button class="btn btn-danger" onclick="deleteNotice('${docSnap.id}')">
                <i class="fas fa-trash"></i> ডিলিট
              </button>
            </div>
          `;
          container.appendChild(div);
        });
      } catch(e) {
        console.error(e);
        container.innerHTML = '<p style="text-align: center; color: #ef4444; padding: 2rem;">ডেটা লোড করতে সমস্যা হচ্ছে। Firebase Rules চেক করুন।</p>';
      }
    };

    // Edit Notice
    window.editNotice = (id, text, link, expiry) => {
      document.getElementById('noticeId').value = id;
      document.getElementById('noticeText').value = text;
      document.getElementById('noticeLink').value = link;
      document.getElementById('noticeExpiry').value = expiry;
      document.getElementById('formTitle').innerText = 'নোটিশ এডিট করুন';
      document.getElementById('saveBtn').innerHTML = '<i class="fas fa-sync"></i> আপডেট করুন';
      document.getElementById('cancelBtn').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Delete Notice
    window.deleteNotice = async (id) => {
      if(confirm('আপনি কি নিশ্চিত যে এই নোটিশটি মুছে ফেলতে চান? এটি পূর্বাবস্থায় ফেরানো যাবে না।')) {
        try {
          await deleteDoc(doc(db, "notices", id));
          loadNotices();
        } catch(e) { 
          alert('ডিলিট করতে সমস্যা হয়েছে: ' + e.message); 
        }
      }
    };

    // Reset Form
    window.resetForm = () => {
      document.getElementById('noticeId').value = '';
      document.getElementById('noticeText').value = '';
      document.getElementById('noticeLink').value = '';
      document.getElementById('noticeExpiry').value = '';
      document.getElementById('formTitle').innerText = 'নতুন নোটিশ যোগ করুন';
      document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> সেভ করুন';
      document.getElementById('cancelBtn').style.display = 'none';
    };
  </script>
</body>
</html>
